[project]
name = "biocn-tools"
version = "0.1.0"
description = "Export bioCN's HanLP models (TOK/POS/DEP) to Android-ready ONNX"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Version combo mirrors bioCN's uv.lock (hanlp 2.1.3 + torch 2.9.x + transformers 4.57.x).
    "hanlp==2.1.3",
    "loguru>=0.7.3",
    "onnx>=1.19.0",
    "onnxruntime>=1.20.0",
    "torch>=2.9.0,<2.10.0",
    "transformers>=4.57.0,<4.58.0",
]

[tool.uv.sources]
# CPU-only torch wheels: 4x smaller download than the CUDA default on Linux,
# and all we need for ONNX export.
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
# Script project: no need to build/install itself.
package = false
