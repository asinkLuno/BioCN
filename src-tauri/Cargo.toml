[package]
name = "biocn"
version = "0.4.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "biocn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Whole-book coloring speed on real EPUBs: parses, splits and analyzes each
# book through the app's own pipeline, per weight variant, and prints wall
# times. Not part of `cargo build`/`cargo test`; run it explicitly:
#   cargo bench -p biocn --bench books -- <models-root> <book.epub>...
[[bench]]
name = "books"
harness = false

[dev-dependencies]
tempfile = "3"
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri = { version = "2", features = ["test"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `write` is what turns a parsed book back into an EPUB: exporting a colored
# book rewrites each chapter's XHTML in place rather than building a new
# archive, so the original layout, images and styles survive untouched.
rbook = { version = "0.7", default-features = false, features = ["write"] }
sha2 = "0.10"
unicode-normalization = "0.1"
unicode-general-category = "1"
# Model downloads (src/models.rs). `rustls` rather than the default native TLS
# keeps the same features building for Android without openssl-sys.
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "http2",
  "charset",
  "stream",
] }
# Chapter text is XHTML, so this is the parser; `encoding` gives it the
# declared-charset handling older Chinese books need (GB2312 chapters).
quick-xml = { version = "0.42", features = ["encoding"] }
encoding_rs = "0.8"
# Persistent 主谓宾 cache (src/cache.rs). `bundled` compiles SQLite in: Android
# has no system libsqlite3 to link against, and the bundled build is the one
# whose version is known to support WAL and the upserts the schema uses.
rusqlite = { version = "0.32", features = ["bundled"] }

# ONNX Runtime for the 主谓宾 analyzer (src/analysis). All platforms use
# `load-dynamic`: the binary ships a minimal-build `libonnxruntime` next to the
# executable (or in the APK's jniLibs on Android), keeping the 15 MB of unused
# ExecutionProvider code out of the binary. `tls-rustls` matches reqwest so no
# openssl toolchain is needed. Build/retrieve the library with
# tools/build_ort_desktop.py compiles the per-platform minimal library
# (src-tauri/ort/<platform>/, gitignored, CI-only artifact).
[target.'cfg(not(target_os = "android"))'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = [
  "std",
  "load-dynamic",
  "tls-rustls",
] }

[target.'cfg(target_os = "android")'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = [
  "std",
  "load-dynamic",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
