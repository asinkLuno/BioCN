<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- BioCN「语法双螺旋」启动页动画版：与 biocn-logo-2-helix.svg 同一标记。
       等距正弦螺旋比例（宽高约 1:1.61），三交点「绿压橙 → 橙压绿 → 绿压橙」；
       中段由 clipPath 同步覆写橙链实现穿插，被压处仅作轻度哑光压暗以保留纯粹品牌色。
       动画编排（纯 CSS，无 JS，透明背景，适合直接放进启动页 webview）：
       1) 两条主链以顺滑缓动先后生长（0.08s / 0.26s 起，各 1.35s）；
       2) 三条紫色横档随双链攀升自橙链向绿链交替搭桥连接（0.32s / 0.56s / 0.78s）；
       3) 之后横档保持克制的相位呼吸（1.75s 起循环）。
       遵循 prefers-reduced-motion：系统减弱动态时直接呈现完整静态标记。 -->
  <defs>
    <!-- 仅罩住中间交点 (50, 47)，把中段橙链翻到绿链上方而不打断整条描边动画 -->
    <clipPath id="biocn-over-mid">
      <rect x="34" y="37" width="32" height="20"/>
    </clipPath>
    <!-- 橙链轻度哑光压暗：仅在下交点 y=75 与上交点 y=19 被绿链遮挡处微暗 -->
    <linearGradient id="biocn-grad-o" gradientUnits="userSpaceOnUse" x1="0" y1="89" x2="0" y2="11.5">
      <stop offset="0%" stop-color="#d95f02"/>
      <stop offset="13%" stop-color="#d95f02"/>
      <stop offset="18%" stop-color="#b84e00"/>
      <stop offset="23%" stop-color="#d95f02"/>
      <stop offset="85%" stop-color="#d95f02"/>
      <stop offset="90%" stop-color="#b84e00"/>
      <stop offset="95%" stop-color="#d95f02"/>
      <stop offset="100%" stop-color="#d95f02"/>
    </linearGradient>
    <!-- 绿链轻度哑光压暗：仅在中交点 y=47 被橙链遮挡处微暗 -->
    <linearGradient id="biocn-grad-g" gradientUnits="userSpaceOnUse" x1="0" y1="89" x2="0" y2="11.5">
      <stop offset="0%" stop-color="#1b9e77"/>
      <stop offset="49%" stop-color="#1b9e77"/>
      <stop offset="54%" stop-color="#147e5e"/>
      <stop offset="59%" stop-color="#1b9e77"/>
      <stop offset="100%" stop-color="#1b9e77"/>
    </linearGradient>
  </defs>
  <style>
    .strand {
      fill: none;
      stroke-width: 5.6;
      stroke-linecap: round;
      stroke-dasharray: 100 110;
      stroke-dashoffset: 105;
      opacity: 0;
      animation:
        biocn-draw 1.35s cubic-bezier(0.38, 0.04, 0.22, 1) forwards,
        biocn-show 0.05s linear forwards;
    }
    .strand-o { stroke: url(#biocn-grad-o); animation-delay: 0.08s, 0.13s; }
    .strand-g { stroke: url(#biocn-grad-g); animation-delay: 0.26s, 0.31s; }

    .rung {
      stroke: #7570b3;
      stroke-width: 3.6;
      stroke-linecap: round;
      stroke-dasharray: 100 110;
      stroke-dashoffset: 105;
      opacity: 0;
      animation:
        biocn-draw 0.36s cubic-bezier(0.22, 0.72, 0.25, 1) forwards,
        biocn-show 0.05s linear forwards,
        biocn-breathe 3.4s ease-in-out infinite;
    }
    .rung-1 { animation-delay: 0.32s, 0.36s, 1.75s; }
    .rung-2 { animation-delay: 0.56s, 0.6s, 2.05s; }
    .rung-3 { animation-delay: 0.78s, 0.82s, 2.35s; }

    @keyframes biocn-draw { to { stroke-dashoffset: 0; } }
    @keyframes biocn-show { to { opacity: 1; } }
    @keyframes biocn-breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.62; } }

    @media (prefers-reduced-motion: reduce) {
      .strand, .rung {
        animation: none;
        stroke-dashoffset: 0;
        opacity: 1;
      }
    }
  </style>

  <!-- 横档：随双链到达各层节点，自橙链向绿链交替搭桥 -->
  <line class="rung rung-1" pathLength="100" x1="72" y1="87" x2="28" y2="87"/>
  <line class="rung rung-2" pathLength="100" x1="28" y1="61" x2="72" y2="61"/>
  <line class="rung rung-3" pathLength="100" x1="72" y1="33" x2="28" y2="33"/>

  <!-- 双链：先后描画生长，下/上交点绿压橙，中交点由 clipPath 补丁实现橙压绿 -->
  <path class="strand strand-o" pathLength="100"
        d="M 73 89 C 73 78.4 27 71.6 27 61 C 27 50.4 73 43.6 73 33 C 73 24.7 45 18.8 32.7 11.5"/>
  <path class="strand strand-g" pathLength="100"
        d="M 27 89 C 27 78.4 73 71.6 73 61 C 73 50.4 27 43.6 27 33 C 27 24.7 55 18.8 67.3 11.5"/>
  <path class="strand strand-o" pathLength="100" clip-path="url(#biocn-over-mid)"
        d="M 73 89 C 73 78.4 27 71.6 27 61 C 27 50.4 73 43.6 73 33 C 73 24.7 45 18.8 32.7 11.5"/>
</svg>
