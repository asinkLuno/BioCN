<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- BioCN「语法双螺旋」启动页动画版：与 biocn-logo-2-helix.svg 同一标记。
       上下完全对称的等距正弦双螺旋（中点 (50, 50)，头尾等长张开），
       三交点「绿压橙 → 橙压绿 → 绿压橙」，上下两圈腹内各设一条紫色横档。
       动画编排（纯 CSS，无 JS，透明背景，适合直接放进启动页 webview）：
       1) 两条主链顺滑先后生长（0.08s / 0.26s 起，各 1.35s）；
       2) 两条紫色横档随双链展开两圈，自橙链向绿链交替搭桥（0.52s / 0.76s）；
       3) 之后横档保持克制的相位呼吸（1.75s 起循环）。
       遵循 prefers-reduced-motion：系统减弱动态时直接呈现完整静态标记。 -->
  <defs>
    <!-- 仅罩住中央交点 (50, 50)，把中段橙链翻到绿链上方而不打断整条描边动画 -->
    <clipPath id="biocn-over-mid">
      <rect x="34" y="40" width="32" height="20"/>
    </clipPath>
    <!-- 橙链轻度哑光压暗：仅在下交点 y=81 与上交点 y=19 被绿链遮挡处微暗 -->
    <linearGradient id="biocn-grad-o" gradientUnits="userSpaceOnUse" x1="0" y1="89.9" x2="0" y2="10.1">
      <stop offset="0%" stop-color="#d95f02"/>
      <stop offset="6.1%" stop-color="#d95f02"/>
      <stop offset="11.1%" stop-color="#b84e00"/>
      <stop offset="16.1%" stop-color="#d95f02"/>
      <stop offset="83.9%" stop-color="#d95f02"/>
      <stop offset="88.9%" stop-color="#b84e00"/>
      <stop offset="93.9%" stop-color="#d95f02"/>
      <stop offset="100%" stop-color="#d95f02"/>
    </linearGradient>
    <!-- 绿链轻度哑光压暗：仅在中央交点 y=50 被橙链遮挡处微暗 -->
    <linearGradient id="biocn-grad-g" gradientUnits="userSpaceOnUse" x1="0" y1="89.9" x2="0" y2="10.1">
      <stop offset="0%" stop-color="#1b9e77"/>
      <stop offset="45%" stop-color="#1b9e77"/>
      <stop offset="50%" stop-color="#147e5e"/>
      <stop offset="55%" stop-color="#1b9e77"/>
      <stop offset="100%" stop-color="#1b9e77"/>
    </linearGradient>
  </defs>
  <style>
    .strand {
      fill: none;
      stroke-width: 5.6;
      stroke-linecap: round;
      stroke-dasharray: 100 110;
      stroke-dashoffset: 105;
      opacity: 0;
      animation:
        biocn-draw 1.35s cubic-bezier(0.38, 0.04, 0.22, 1) forwards,
        biocn-show 0.05s linear forwards;
    }
    .strand-o { stroke: url(#biocn-grad-o); animation-delay: 0.08s, 0.13s; }
    .strand-g { stroke: url(#biocn-grad-g); animation-delay: 0.26s, 0.31s; }

    .rung {
      stroke: #7570b3;
      stroke-width: 3.8;
      stroke-linecap: round;
      stroke-dasharray: 100 110;
      stroke-dashoffset: 105;
      opacity: 0;
      animation:
        biocn-draw 0.36s cubic-bezier(0.22, 0.72, 0.25, 1) forwards,
        biocn-show 0.05s linear forwards,
        biocn-breathe 3.4s ease-in-out infinite;
    }
    .rung-1 { animation-delay: 0.52s, 0.56s, 1.75s; }
    .rung-2 { animation-delay: 0.76s, 0.8s, 2.05s; }

    @keyframes biocn-draw { to { stroke-dashoffset: 0; } }
    @keyframes biocn-show { to { opacity: 1; } }
    @keyframes biocn-breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.62; } }

    @media (prefers-reduced-motion: reduce) {
      .strand, .rung {
        animation: none;
        stroke-dashoffset: 0;
        opacity: 1;
      }
    }
  </style>

  <!-- 两条对称横档：下圈左→右、上圈右→左，自橙链向绿链搭桥 -->
  <line class="rung rung-1" pathLength="100" x1="28" y1="65.5" x2="72" y2="65.5"/>
  <line class="rung rung-2" pathLength="100" x1="72" y1="34.5" x2="28" y2="34.5"/>

  <!-- 双链：上下镜像对称，下/上交点绿压橙，中央交点由 clipPath 实现橙压绿 -->
  <path class="strand strand-o" pathLength="100"
        d="M 68.2 89.9 C 56.4 81.6 27 74.9 27 65.5 C 27 53.7 73 46.3 73 34.5 C 73 25.1 43.6 18.4 31.8 10.1"/>
  <path class="strand strand-g" pathLength="100"
        d="M 31.8 89.9 C 43.6 81.6 73 74.9 73 65.5 C 73 53.7 27 46.3 27 34.5 C 27 25.1 56.4 18.4 68.2 10.1"/>
  <path class="strand strand-o" pathLength="100" clip-path="url(#biocn-over-mid)"
        d="M 68.2 89.9 C 56.4 81.6 27 74.9 27 65.5 C 27 53.7 73 46.3 73 34.5 C 73 25.1 43.6 18.4 31.8 10.1"/>
</svg>
