<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BioCN · SVO 双螺旋标记草图</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f5f6; color: #202523; font: 15px/1.6 system-ui, sans-serif; }
    main { max-width: 1120px; margin: auto; padding: 48px 24px 72px; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .intro { max-width: 700px; color: #59625e; }
    .palette { display: flex; gap: 18px; margin: 22px 0 30px; color: #46504b; font-size: 13px; }
    .palette span { display: inline-flex; align-items: center; gap: 7px; }
    .dot { width: 11px; height: 11px; border-radius: 50%; }
    .options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    article { background: white; border: 1px solid #dce1de; border-radius: 8px; padding: 20px; }
    article h2 { margin: 0 0 4px; font-size: 17px; }
    article p { min-height: 48px; margin: 0; color: #5e6762; font-size: 13px; }
    .preview { display: grid; place-items: center; margin: 18px 0; min-height: 240px; background: #fafbfa; border-radius: 6px; }
    .preview svg { width: 220px; height: 220px; }
    .scales { display: flex; align-items: end; gap: 14px; border-top: 1px solid #e5e9e6; padding-top: 14px; }
    .sample { display: grid; justify-items: center; gap: 4px; color: #77807b; font-size: 10px; }
    .sample svg { display: block; }
    .sample.dark { background: #222725; border-radius: 5px; padding: 5px; }
    @media (max-width: 800px) { .options { grid-template-columns: 1fr; } article p { min-height: 0; } .preview { min-height: 220px; } }
  </style>
</head>
<body>
<main>
  <h1>SVO 双螺旋 · 方向草图</h1>
  <p class="intro">三种做法都沿左下至右上约 45° 延伸，并用 S / V / O 表示主语、谓语、宾语。先比较字母如何成为螺旋结构，再选一个方向细化。</p>
  <div class="palette">
    <span><i class="dot" style="background:#d95f02"></i>S · 主语</span>
    <span><i class="dot" style="background:#1b9e77"></i>V · 谓语</span>
    <span><i class="dot" style="background:#7570b3"></i>O · 宾语</span>
  </div>
  <section class="options">
    <article>
      <h2>01 · 字母作链</h2>
      <p>S 与 V 沿两条交错曲线重复排布，O 作为短横连接两链。整体最接近传统双螺旋。</p>
      <div class="preview">
        <svg viewBox="0 0 100 100" role="img" aria-label="S、V、O 字母构成的斜向双螺旋">
          <g transform="rotate(45 50 50)" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">
            <path d="M18 78 C18 63 42 63 42 50 S66 37 66 22" fill="none" stroke="#d95f02" stroke-width="2" opacity=".25"/>
            <path d="M34 78 C34 63 10 63 10 50 S-14 37 -14 22" fill="none" stroke="#1b9e77" stroke-width="2" opacity=".25"/>
            <text x="19" y="76" fill="#d95f02" font-size="15">S</text><text x="38" y="62" fill="#d95f02" font-size="15">S</text><text x="44" y="45" fill="#d95f02" font-size="15">S</text><text x="63" y="30" fill="#d95f02" font-size="15">S</text>
            <text x="33" y="76" fill="#1b9e77" font-size="15">V</text><text x="13" y="62" fill="#1b9e77" font-size="15">V</text><text x="9" y="45" fill="#1b9e77" font-size="15">V</text><text x="-10" y="30" fill="#1b9e77" font-size="15">V</text>
            <text x="26" y="71" fill="#7570b3" font-size="9">O</text><text x="25" y="54" fill="#7570b3" font-size="9">O</text><text x="27" y="37" fill="#7570b3" font-size="9">O</text>
          </g>
        </svg>
      </div>
      <div class="scales">
        <span class="sample"><svg viewBox="0 0 100 100" width="64" height="64" aria-hidden="true"><g transform="rotate(45 50 50)" font-family="Arial,sans-serif" font-weight="700" text-anchor="middle"><path d="M18 78C18 63 42 63 42 50S66 37 66 22M34 78C34 63 10 63 10 50S-14 37-14 22" fill="none" stroke="#999" stroke-width="1"/><text x="19" y="76" fill="#d95f02" font-size="15">S</text><text x="38" y="62" fill="#d95f02" font-size="15">S</text><text x="33" y="76" fill="#1b9e77" font-size="15">V</text><text x="13" y="62" fill="#1b9e77" font-size="15">V</text><text x="26" y="71" fill="#7570b3" font-size="9">O</text></g></svg><span>64 px</span></span>
        <span class="sample dark"><svg viewBox="0 0 100 100" width="32" height="32" aria-hidden="true"><g transform="rotate(45 50 50)" font-family="Arial,sans-serif" font-weight="700" text-anchor="middle"><text x="19" y="76" fill="#d95f02" font-size="15">S</text><text x="38" y="62" fill="#d95f02" font-size="15">S</text><text x="33" y="76" fill="#1b9e77" font-size="15">V</text><text x="13" y="62" fill="#1b9e77" font-size="15">V</text><text x="26" y="71" fill="#7570b3" font-size="9">O</text></g></svg></span>
      </div>
    </article>
    <article>
      <h2>02 · 字母成结</h2>
      <p>S / V / O 直接交替成为两条粗链的转折节点，图形更像一个紧凑的字母标记。</p>
      <div class="preview">
        <svg viewBox="0 0 100 100" role="img" aria-label="SVO 字母交织成结的斜向标记">
          <g transform="rotate(45 50 50)" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 78 C20 66 39 66 39 54 C39 42 20 42 20 30 C20 18 39 18 39 7" stroke="#d95f02" stroke-width="8"/>
            <path d="M38 78 C38 66 19 66 19 54 C19 42 38 42 38 30 C38 18 19 18 19 7" stroke="#1b9e77" stroke-width="8"/>
            <path d="M25 69 L33 69 M25 45 L33 45 M25 21 L33 21" stroke="#7570b3" stroke-width="5"/>
          </g>
          <g transform="rotate(45 50 50)" font-family="Arial,sans-serif" font-size="9" font-weight="700" text-anchor="middle">
            <text x="28" y="61" fill="#fff">S</text><text x="29" y="37" fill="#fff">V</text><text x="29" y="13" fill="#fff">O</text>
          </g>
        </svg>
      </div>
      <div class="scales">
        <span class="sample"><svg viewBox="0 0 100 100" width="64" height="64" aria-hidden="true"><g transform="rotate(45 50 50)" fill="none" stroke-linecap="round"><path d="M20 78C20 66 39 66 39 54S20 42 20 30S39 18 39 7" stroke="#d95f02" stroke-width="8"/><path d="M38 78C38 66 19 66 19 54S38 42 38 30S19 18 19 7" stroke="#1b9e77" stroke-width="8"/><path d="M25 69h8M25 45h8M25 21h8" stroke="#7570b3" stroke-width="5"/></g><text x="28" y="61" fill="white" font-size="9" font-weight="700">S</text><text x="29" y="37" fill="white" font-size="9" font-weight="700">V</text><text x="29" y="13" fill="white" font-size="9" font-weight="700">O</text></svg><span>64 px</span></span>
        <span class="sample dark"><svg viewBox="0 0 100 100" width="32" height="32" aria-hidden="true"><g transform="rotate(45 50 50)" fill="none" stroke-linecap="round"><path d="M20 78C20 66 39 66 39 54S20 42 20 30S39 18 39 7" stroke="#d95f02" stroke-width="8"/><path d="M38 78C38 66 19 66 19 54S38 42 38 30S19 18 19 7" stroke="#1b9e77" stroke-width="8"/><path d="M25 69h8M25 45h8M25 21h8" stroke="#7570b3" stroke-width="5"/></g></svg></span>
      </div>
    </article>
    <article>
      <h2>03 · SVO 作節拍</h2>
      <p>每一段交叉都由完整的 S、V、O 字母组成，读序更明确，轮廓更轻、更适合做动效。</p>
      <div class="preview">
        <svg viewBox="0 0 100 100" role="img" aria-label="SVO 字母序列组成的斜向双螺旋">
          <g transform="rotate(45 50 50)" font-family="Arial,sans-serif" font-weight="700" text-anchor="middle">
            <path d="M22 80 C22 63 55 62 55 47 S22 33 22 18" fill="none" stroke="#d95f02" stroke-width="1.5" opacity=".3"/>
            <path d="M40 80 C40 63 7 62 7 47 S40 33 40 18" fill="none" stroke="#1b9e77" stroke-width="1.5" opacity=".3"/>
            <text x="24" y="76" fill="#d95f02" font-size="13">S</text><text x="46" y="59" fill="#1b9e77" font-size="13">V</text><text x="24" y="43" fill="#7570b3" font-size="13">O</text><text x="16" y="27" fill="#d95f02" font-size="13">S</text><text x="37" y="19" fill="#1b9e77" font-size="13">V</text>
            <text x="39" y="76" fill="#1b9e77" font-size="13">V</text><text x="17" y="59" fill="#7570b3" font-size="13">O</text><text x="39" y="43" fill="#d95f02" font-size="13">S</text><text x="31" y="27" fill="#1b9e77" font-size="13">V</text>
          </g>
        </svg>
      </div>
      <div class="scales">
        <span class="sample"><svg viewBox="0 0 100 100" width="64" height="64" aria-hidden="true"><g transform="rotate(45 50 50)" font-family="Arial,sans-serif" font-weight="700" text-anchor="middle"><text x="24" y="76" fill="#d95f02" font-size="13">S</text><text x="46" y="59" fill="#1b9e77" font-size="13">V</text><text x="24" y="43" fill="#7570b3" font-size="13">O</text><text x="16" y="27" fill="#d95f02" font-size="13">S</text><text x="39" y="76" fill="#1b9e77" font-size="13">V</text><text x="17" y="59" fill="#7570b3" font-size="13">O</text></g></svg><span>64 px</span></span>
        <span class="sample dark"><svg viewBox="0 0 100 100" width="32" height="32" aria-hidden="true"><g transform="rotate(45 50 50)" font-family="Arial,sans-serif" font-weight="700" text-anchor="middle"><text x="24" y="76" fill="#d95f02" font-size="13">S</text><text x="46" y="59" fill="#1b9e77" font-size="13">V</text><text x="24" y="43" fill="#7570b3" font-size="13">O</text><text x="16" y="27" fill="#d95f02" font-size="13">S</text><text x="39" y="76" fill="#1b9e77" font-size="13">V</text><text x="17" y="59" fill="#7570b3" font-size="13">O</text></g></svg></span>
      </div>
    </article>
  </section>
</main>
</body>
</html>
