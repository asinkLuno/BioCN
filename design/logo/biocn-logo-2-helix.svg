<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- BioCN「语法双螺旋」：Bio 的双螺旋。绿链（谓语）与橙链（主语）相互缠绕，
       紫色横档（宾语）在每一层把两者连成梯，三种颜色即主谓宾三色。
       链条占满画布，顶端自然张开收尾（无箭头）。 -->
  <!-- 横档（底层，两端藏进链身） -->
  <g stroke="#7570b3" stroke-width="4" stroke-linecap="round">
    <line x1="31" y1="88" x2="69" y2="88"/>
    <line x1="31" y1="58" x2="69" y2="58"/>
    <line x1="31" y1="28" x2="69" y2="28"/>
  </g>
  <!-- 双链 -->
  <g fill="none" stroke-width="6" stroke-linecap="round">
    <path d="M 70 92 C 70 78 30 72 30 58 C 30 44 70 40 70 28 C 70 16 54 12 34 7" stroke="#d95f02"/>
    <path d="M 30 92 C 30 78 70 72 70 58 C 70 44 30 40 30 28 C 30 16 46 12 66 7" stroke="#1b9e77"/>
  </g>
</svg>
