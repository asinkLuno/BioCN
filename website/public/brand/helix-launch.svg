<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- BioCN「语法双螺旋」启动页动画版：与 biocn-logo-2-helix.svg 同一标记。
       动画编排（纯 CSS，无 JS，透明背景，适合直接放进启动页 webview）：
       1) 两条主链依次描画生长（0.1s / 0.3s 起，各 1.5s）；
       2) 三条紫色横档自下而上依次点亮（0.95s 起）；
       3) 之后横档带轻微相位差的呼吸律动（2.4s 起循环）。
       实现细节：链身初始 opacity:0，在描画开始后 60ms 才显形——
       避开 round linecap 在零长度 dash 上的圆点伪影。
       遵循 prefers-reduced-motion：系统减弱动态时直接呈现完整静态标记。 -->
  <style>
    .strand {
      fill: none;
      stroke-width: 6;
      stroke-linecap: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      opacity: 0;
      animation:
        biocn-draw 1.5s cubic-bezier(0.55, 0.06, 0.28, 0.99) forwards,
        biocn-show 0.06s linear forwards;
    }
    .strand-o { stroke: #d95f02; animation-delay: 0.1s, 0.16s; }
    .strand-g { stroke: #1b9e77; animation-delay: 0.3s, 0.36s; }

    .rung {
      stroke: #7570b3;
      stroke-width: 4;
      stroke-linecap: round;
      opacity: 0;
      animation:
        biocn-pop 0.45s cubic-bezier(0.2, 0.8, 0.3, 1.2) forwards,
        biocn-breathe 3.2s ease-in-out 2.4s infinite;
    }
    .rung-1 { animation-delay: 0.95s, 2.4s; }
    .rung-2 { animation-delay: 1.1s, 2.7s; }
    .rung-3 { animation-delay: 1.25s, 3s; }

    @keyframes biocn-draw { to { stroke-dashoffset: 0; } }
    @keyframes biocn-show { to { opacity: 1; } }
    @keyframes biocn-pop { from { opacity: 0; } to { opacity: 1; } }
    @keyframes biocn-breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }

    @media (prefers-reduced-motion: reduce) {
      .strand, .rung { animation: none; }
      .strand { stroke-dashoffset: 0; opacity: 1; }
      .rung { opacity: 1; }
    }
  </style>

  <!-- 横档：自下而上依次点亮 -->
  <line class="rung rung-1" x1="31" y1="88" x2="69" y2="88"/>
  <line class="rung rung-2" x1="31" y1="58" x2="69" y2="58"/>
  <line class="rung rung-3" x1="31" y1="28" x2="69" y2="28"/>

  <!-- 双链：先后描画生长 -->
  <path class="strand strand-o" pathLength="1"
        d="M 70 92 C 70 78 30 72 30 58 C 30 44 70 40 70 28 C 70 16 54 12 34 7"/>
  <path class="strand strand-g" pathLength="1"
        d="M 30 92 C 30 78 70 72 70 58 C 70 44 30 40 30 28 C 30 16 46 12 66 7"/>
</svg>
